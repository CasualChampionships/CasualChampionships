[versions]
minecraft       = "1.21.6"
fabric-loader   = "0.16.14"
parchment       = "1.21.5:2025.06.15"
fabric-api      = "0.127.1+1.21.6"
fabric-kotlin   = "1.13.3+kotlin.2.1.21"
map-canvas      = "0.5.1+1.21.5"
arcade          = "0.5.1-beta.28+1.21.6"
server-replay   = "2.3.0+1.21.5"
casual-database = "0.2.0"

# Plugins
fabric-loom = "1.10-SNAPSHOT"

[libraries]
minecraft       = { module = "com.mojang:minecraft"                         , version.ref = "minecraft" }
fabric-loader   = { module = "net.fabricmc:fabric-loader"                   , version.ref = "fabric-loader" }
fabric-api      = { module = "net.fabricmc.fabric-api:fabric-api"           , version.ref = "fabric-api" }
fabric-kotlin   = { module = "net.fabricmc:fabric-language-kotlin"          , version.ref = "fabric-kotlin" }
map-canvas      = { module = "eu.pb4:map-canvas-api"                        , version.ref = "map-canvas" }
arcade          = { module = "net.casualchampionships:arcade"               , version.ref = "arcade" }
arcade-datagen  = { module = "net.casualchampionships:arcade-datagen"       , version.ref = "arcade" }
casual-database = { module = "net.casual-championships:casual-database-core", version.ref = "casual-database" }
server-replay   = { module = "me.senseiwells:server-replay"                 , version.ref = "server-replay" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }